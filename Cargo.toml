[package]
name = "tenshi-no-hana"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tenshi-no-hana"
path = "src/main.rs"
required-features = ["wifi"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["wifi"]
embassy = [
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-rp",
    "dep:embassy-sync",
    "dep:embassy-futures",
]
wifi = [
    "embassy",
    "dep:embassy-net",
    "dep:embassy-net-esp-hosted-mcu",
    "dep:embedded-hal-bus",
    "dep:embedded-hal-async",
    "dep:embedded-io-async",
    "dep:heapless",
    "dep:static_cell",
    "dep:micro-xrce-dds-rs",
    "dep:embassy-ros",
    "dep:std_msgs",
    "dep:geometry_msgs",
    "dep:sensor_msgs",
    "dep:nav_msgs",
    "dep:tf2_msgs",
]

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
libm = "0.2"
embedded-hal = { version = "1.0.0" }
defmt = "1.0"
defmt-rtt = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

# Embassy dependencies (optional, enabled via "embassy" feature)
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
], optional = true }
embassy-time = { version = "0.5", features = ["defmt"], optional = true }
embassy-rp = { version = "0.10", features = [
    "defmt",
    "rp2040",
    "time-driver",
    "critical-section-impl",
    "boot2-generic-03h",
], optional = true }
embassy-sync = { version = "0.8", features = ["defmt"], optional = true }
embassy-futures = { version = "0.1", optional = true }

# WiFi dependencies (optional, enabled via "wifi" feature)
embassy-net = { version = "0.7", features = [
    "tcp",
    "dhcpv4",
    "medium-ethernet",
], optional = true }
embassy-net-esp-hosted-mcu = { path = "external/embassy/embassy-net-esp-hosted-mcu", features = [
    "defmt",
], optional = true }
embedded-hal-bus = { version = "0.2", features = ["async"], optional = true }
embedded-hal-async = { version = "1.0", optional = true }
embedded-io-async = { version = "0.6", optional = true }
heapless = { version = "0.8", optional = true }
static_cell = { version = "2", optional = true }
micro-xrce-dds-rs = { path = "external/micro_xrce_dds_rs", default-features = false, features = [
    "defmt",
    "embassy-net",
], optional = true }
embassy-ros = { path = "external/micro_xrce_dds_rs/embassy_ros", default-features = false, features = [
    "defmt",
    "embassy-net",
    "executor",
], optional = true }
std_msgs = { path = "generated/std_msgs", optional = true }
geometry_msgs = { path = "generated/geometry_msgs", optional = true }
sensor_msgs = { path = "generated/sensor_msgs", optional = true }
nav_msgs = { path = "generated/nav_msgs", optional = true }
tf2_msgs = { path = "generated/tf2_msgs", optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dev-dependencies]
defmt-test = "0.4"

[[test]]
name = "rover_math"
harness = false
required-features = ["embassy"]

# cargo build/run
[profile.dev]
codegen-units = 1
debug = true
debug-assertions = true
incremental = false
# Generic dependency code is monomorphized in this crate. At opt-level=0,
# Rpc::decode alone allocates 612,708 stack bytes on thumbv6m-none-eabi.
opt-level = 2
overflow-checks = true

# Keep dependency code optimized as well as application monomorphizations.
# Reasons:
#   1. micropb-generated CtrlMsg::decode() has 64 oneof match arms.
#      At opt-level=0 the compiler doesn't reuse stack slots → ~96 KB.
#   2. Embassy async poll chains (executor/time/sync/rp/net) accumulate
#      large stack frames at opt-level=0. The ioctl path has 6 nested
#      async levels; unoptimized poll frames corrupt memory during decode.
#   3. Standard embedded-Rust best practice for Cortex-M0+.
[profile.dev.package."*"]
opt-level = 2

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

[patch.crates-io]
embassy-futures = { path = "external/embassy/embassy-futures" }
embassy-sync = { path = "external/embassy/embassy-sync" }
embassy-time = { path = "external/embassy/embassy-time" }
embassy-net-driver = { path = "external/embassy/embassy-net-driver" }
embassy-net-driver-channel = { path = "external/embassy/embassy-net-driver-channel" }
embassy-time-driver = { path = "external/embassy/embassy-time-driver" }
