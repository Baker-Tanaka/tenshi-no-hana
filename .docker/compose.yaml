services:
  tenshi-no-hana:
    build:
      context: .
      dockerfile: Dockerfile
    image: "tenshi-no-hana-dev:latest"
    user: vscode
    container_name: "tenshi-no-hana-container"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "../:/tenshi-no-hana"
    working_dir: /tenshi-no-hana
    command: sleep infinity
    environment:
      MICROROS_AGENT_AUTOSTART: "1"
      MICROROS_AGENT_PORT: "8888"
    ports:
      - "8888:8888"
